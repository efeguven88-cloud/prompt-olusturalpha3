name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını www klasörüne kopyala
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Android platformu yoksa ekle
        run: '[ -d android ] || npx cap add android'

      - name: Bildirim iznini ekle
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: prompt-olustur-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
